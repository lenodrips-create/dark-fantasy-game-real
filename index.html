<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Fantasy</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0622; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 0 16px; text-align: center;
    background: #0e0622; color: #d2cdbe; font: 18px/1.5 Georgia, serif;
  }
  #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #2a2140; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #d2cdbe; transition: width 0.2s; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">
  <div id="status">Loading...</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<script>
  // Files the game reads from levels/, the same as the desktop version
  var FILES = ['levels/GroundWithHills.glb', 'levels/sky.jpg'];
  var canvas = document.getElementById('canvas');
  var loadingEl = document.getElementById('loading');
  var statusEl = document.getElementById('status');
  var fillEl = document.getElementById('fill');

  function showMessage(text) {
    statusEl.textContent = text;
    document.getElementById('bar').style.display = 'none';
    loadingEl.style.display = 'flex';
  }

  // Downloads the map and sky with a progress bar. They're read from levels/ like on desktop,
  // so replacing them in the repository updates the web game too.
  function downloadFiles() {
    var totals = FILES.map(function () { return 0; });
    var received = FILES.map(function () { return 0; });
    function showProgress() {
      var total = totals.reduce(function (a, b) { return a + b; }, 0);
      var done = received.reduce(function (a, b) { return a + b; }, 0);
      if (total > 0) fillEl.style.width = Math.min(100, done/total*100) + '%';
    }
    return Promise.all(FILES.map(function (path, i) {
      return fetch(path).then(function (response) {
        if (!response.ok) throw new Error(path + ': HTTP ' + response.status);
        totals[i] = Number(response.headers.get('Content-Length')) || 0;
        if (!response.body) return response.arrayBuffer().then(function (buffer) { return new Uint8Array(buffer); });

        var reader = response.body.getReader();
        var chunks = [];
        function pump() {
          return reader.read().then(function (result) {
            if (result.done) {
              var data = new Uint8Array(received[i]);
              var offset = 0;
              chunks.forEach(function (chunk) { data.set(chunk, offset); offset += chunk.length; });
              return data;
            }
            chunks.push(result.value);
            received[i] += result.value.length;
            showProgress();
            return pump();
          });
        }
        return pump();
      });
    }));
  }

  var Module = {
    canvas: canvas,
    preRun: [function () {
      statusEl.textContent = 'Downloading the map...';
      Module.addRunDependency('files');
      downloadFiles().then(function (files) {
        statusEl.textContent = 'Starting...';
        fillEl.style.width = '100%';
        Module.FS.mkdir('/levels');
        files.forEach(function (data, i) { Module.FS.writeFile('/' + FILES[i], data); });
        Module.removeRunDependency('files');
      }).catch(function (error) {
        showMessage('Could not download the map (' + error.message + '). Try reloading the page.');
      });
    }],
    postRun: [function () { loadingEl.style.display = 'none'; }],
    onAbort: function () { showMessage('The game crashed. Try reloading the page.'); },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); }
  };

  // Grab the mouse right in the click handler, which browsers require. The game asks for it too, but a frame later.
  canvas.addEventListener('mousedown', function () {
    if (!document.pointerLockElement) canvas.requestPointerLock();
  });

  if (!document.createElement('canvas').getContext('webgl2')) {
    showMessage('This game needs WebGL 2. Try a recent Chrome, Firefox, Edge or Safari.');
  } else {
    var script = document.createElement('script');
    script.src = 'web/dark_fantasy.js';
    script.onerror = function () { showMessage('Could not load the game files. Try reloading the page.'); };
    document.body.appendChild(script);
  }
</script>
</body>
</html>
