<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dark Fantasy Game – Stickman Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 12px; left: 12px;
      color: #ccc; font-size: 14px; pointer-events: none;
      text-shadow: 0 1px 3px #000;
    }
    #ui kbd {
      background: #333; border: 1px solid #555; border-radius: 3px;
      padding: 1px 5px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move · Stickman placeholder</div>
    <div style="margin-top:4px;opacity:0.7">Next step: bring in the original Blender level</div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
